name: Update FEC Tracker

on:
  schedule:
    # Every 6 hours. FEC filings/itemized data don't change faster than that
    # in practice, and this keeps you well under the 1,000 calls/hour limit.
    - cron: "0 */6 * * *"
    # Mondays 12:00 UTC: same run, but ALSO does IE-committee discovery first
    # (see the "Discover new IE committees" step's `if:` below). Discovery
    # adds ~75 API calls, so weekly -- not every run.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      run_discovery:
        description: "Also run IE committee discovery (adds new PACs to entities.csv)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Weekly (or on manual request): find PACs newly making independent
      # expenditures in tracked races and append them to entities.csv as
      # watch-tier / source=ie_discovery rows. Running BEFORE fetch means a
      # newly discovered committee gets its first snapshot in this same run.
      - name: Discover new IE committees (weekly)
        if: github.event.schedule == '0 12 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.run_discovery)
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python discover_ie_committees.py

      - name: Fetch latest FEC data
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python fetch_data.py

      - name: Build dashboard
        run: python build_dashboard.py

      # NOTE: dashboard.html is deliberately NOT committed. It's derived
      # output, rebuilt from data/ on every run -- committing it was the
      # source of every recurring merge conflict between this bot and local
      # edits. It's built fresh above and shipped to Pages as an artifact
      # below; the repo only stores the real state (data/ + entities.csv).
      - name: Commit updated data
        run: |
          git config user.name "fec-tracker-bot"
          git config user.email "actions@github.com"
          git add data/ entities.csv
          git diff --quiet --cached || git commit -m "Update FEC data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp dashboard.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
